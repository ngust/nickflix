<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>NickFlix</title>
<link rel="stylesheet" href="css/style.css">
<script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
<object id="av" type="application/avplayer"></object>

<div id="splash">
  <img class="splash-logo" src="img/logo.png" alt="NickFlix">
  <div class="splash-msg" id="splash-msg">Loading your library&hellip;</div>
  <div class="splash-bar"><div></div></div>
</div>

<div id="app">
  <header id="nav">
    <img class="nav-logo" src="img/logo.png" alt="NickFlix">
    <div id="tabs">
      <div class="tab" data-view="live">TV</div>
      <div class="tab" data-view="movies">Movies</div>
      <div class="tab" data-view="series">Shows</div>
      <div class="tab" data-view="nas">My Media</div>
      <div class="tab" data-view="mylist">My List</div>
      <div class="tab" data-view="search">&#9906; Search</div>
      <div class="tab" data-view="settings">&#9881; Settings</div>
      <div class="tab ptab" data-view="profile"><img id="nav-av" alt=""><span id="nav-name"></span></div>
    </div>
    <div id="clock"></div>
  </header>

  <div id="view">
    <div id="scroller">
      <div id="modebar" class="hidden"></div>
      <section id="hero" class="hidden">
        <img id="hero-bg" alt="">
        <div class="hero-shade"></div>
        <div class="hero-body">
          <div id="hero-kicker" class="kicker"></div>
          <div id="hero-title"></div>
          <div id="hero-meta" class="meta"></div>
          <div id="hero-plot"></div>
          <div class="hero-btns">
            <div class="btn primary" id="hero-play">&#9654;&nbsp; Play</div>
            <div class="btn" id="hero-info">&#9432;&nbsp; More Info</div>
            <div class="btn" id="hero-list">+ My List</div>
          </div>
        </div>
      </section>
      <div id="rows"></div>
    </div>
    <div id="empty" class="hidden"></div>
  </div>

  <section id="search" class="hidden">
    <div class="search-left">
      <div id="search-q" class="search-q"><span class="ph">Type to search&hellip;</span></div>
      <div id="kbd"></div>
      <div id="search-status" class="search-status"></div>
    </div>
    <div id="search-results" class="search-right"></div>
  </section>
</div>

<section id="settings" class="hidden">
  <div id="settings-inner"></div>
</section>

<section id="details" class="hidden">
  <img id="d-bg" alt="">
  <div class="d-shade"></div>
  <div id="d-body"></div>
</section>

<section id="player" class="hidden">
  <video id="video" playsinline></video>
  <div id="osd">
    <div id="osd-title"></div>
    <div id="osd-epg"></div>
    <div id="osd-status"></div>
    <div id="osd-hint"></div>
  </div>
</section>

<section id="who" class="hidden"><div id="who-inner"></div></section>
<section id="pedit" class="hidden"><div id="pedit-inner"></div></section>
<section id="avpick" class="hidden"><div id="avpick-inner"></div></section>
<section id="profile" class="hidden"><div id="profile-inner"></div></section>
<section id="pick" class="hidden"><div id="pick-inner"></div></section>
<section id="teams" class="hidden"><div id="teams-inner"></div></section>
<section id="slot" class="hidden"><div id="slot-inner"></div></section>

<div id="toast" class="hidden"></div>
<script src="js/config.js"></script>
<script src="js/intro.js"></script>
<script src="js/mini.js"></script>
<script src="js/core.js"></script>
<script src="js/logos_idx.js"></script>
<script src="js/logos.js"></script>
<script src="js/learn.js"></script>
<script src="js/profiles.js"></script>
<script src="js/avatars.js"></script>
<script src="js/ui.js"></script>
<script src="js/curated.js"></script>
<script src="js/live.js"></script>
<script src="js/tvx.js"></script>
  <script src="js/tvc.js"></script>
<script src="js/wh.js"></script>
<script src="js/fav.js"></script>
<script src="js/app.js"></script>
<script src="js/coll.js"></script>
<script src="js/sportslive.js"></script>
<script src="js/motor.js"></script>
<script src="js/nas_seed.js"></script>
<script src="js/nas.js"></script>
<script src="js/screens.js"></script>
<script src="js/backup.js"></script>
<script src="js/player.js"></script>
<script src="js/scrub.js"></script>
<script src="js/audio.js"></script>
<script src="js/picks.js"></script>
<script src="js/taste.js"></script>
<script src="js/rate.js"></script>
<script src="js/themes.js"></script>
<script src="js/news.js"></script>
<script src="js/prestige_data.js"></script>
<script src="js/prestige.js"></script>
<script src="js/hate.js"></script>
<script src="js/quality.js"></script>
</body>
</html>
